weight = 3

[[filter.keywords]]
name = "API Gateway"
terms = ["api gateway"]
weight = 2

[[filter.keywords]]
name = "S3"
terms = ["s3"]
weight = 1

[[filter.keywords]]
name = "CloudWatch"
terms = ["cloudwatch"]
weight = 1

[[filter.keywords]]
name = "Serverless"
