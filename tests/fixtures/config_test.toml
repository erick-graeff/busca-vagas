# Regras usadas nos testes de caracterização (as mesmas do protótipo original).

data_dir = "data"

[filter]
title_bonus = 2
title_include = ["developer", "desenvolvedor", "desenvolvedora", "desenvolvedores", "engineer",
                 "software", "backend", "back end", "fullstack", "full stack", "programmer"]
title_exclude = ["sales", "vendas", "client director", "hr", "human resources", "recruiter",
                 "recruiting", "recruitment", "business partner", "vice president",
                 "product manager", "project manager", "delivery manager", "designer",
                 "business analyst", "marketing", "presales", "adoption lead", "account",
                 "devops", "devsecops", "sre", "qa", "quality", "observability", "cybersecurity",
                 "visualization", "architect", "manager", "data", "databricks"]
stack_exclude = ["java", ".net", "c#", "angular", "kotlin", "android", "ios", "golang", "go",
                 "oracle", "dynamics", "aem", "adobe", "salesforce marketing", "sap", "boomi",
                 "huawei"]

[filter.mention_bonus]
points = 3
cap = 5

[[filter.required]]
name = "Python"
terms = ["python"]
weight = 10

[[filter.keywords]]
name = "AWS"
terms = ["aws", "amazon web services"]
weight = 5

[[filter.keywords]]
name = "FastAPI"
terms = ["fastapi"]
weight = 5

