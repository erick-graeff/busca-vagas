[project]
name = "busca-vagas"
version = "0.1.0"
license = "MIT"
description = "Busca vagas em fontes configuráveis, filtra por palavras-chave e avalia a aderência com IA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "requests>=2.34.2",
]

[project.scripts]
busca-vagas = "busca_vagas.adapters.inbound.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busca_vagas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
