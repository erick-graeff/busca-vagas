# Configuração do busca-vagas.
# Copie para config.toml (ignorado pelo git) e ajuste ao seu perfil:
#   cp config.example.toml config.toml
#
# Caminhos relativos são resolvidos a partir da pasta deste arquivo.

# Onde ficam caches e o registro de vagas já vistas.
data_dir = "data"

# ---------------------------------------------------------------------------
# Filtro determinístico (sem IA)
# Termos são palavras/expressões inteiras, sem diferenciar maiúsculas:
# "sql" não casa em "NoSQL", "java" não casa em "JavaScript".
# ---------------------------------------------------------------------------
[filter]
title_bonus = 2  # multiplicador do peso quando o termo aparece no título

# O título precisa citar ao menos um destes (deixe vazio para aceitar qualquer título).
title_include = ["developer", "desenvolvedor", "desenvolvedora", "engineer", "engenheiro",
                 "software", "backend", "back end", "fullstack", "full stack", "programmer"]

# Títulos com qualquer um destes são descartados.
title_exclude = ["sales", "vendas", "recruiter", "designer", "product manager",
                 "project manager", "business analyst", "marketing", "devops", "qa", "manager"]

# Stacks que você não quer. Só olha o título, e é ignorado se o título citar uma
# palavra obrigatória (ex.: "Python/Golang" continua valendo).
stack_exclude = ["java", ".net", "c#", "php"]

# Pontos extras por menção adicional de uma palavra obrigatória.
[filter.mention_bonus]
points = 3
cap = 5

# Palavras obrigatórias: a vaga precisa citar ao menos uma.
[[filter.required]]
name = "Python"
terms = ["python"]
weight = 10

# Palavras que só pontuam (ranking).
[[filter.keywords]]
name = "AWS"
terms = ["aws", "amazon web services"]
weight = 5

[[filter.keywords]]
name = "FastAPI"
terms = ["fastapi"]
weight = 5

[[filter.keywords]]
name = "SQL"
terms = ["sql"]
weight = 3

[[filter.keywords]]
name = "Docker"
terms = ["docker"]
weight = 2

# ---------------------------------------------------------------------------
# Senioridade: termos que indicam cada nível no título.
# Opcional; os padrões abaixo já cobrem português e inglês.
# ---------------------------------------------------------------------------
# [levels]
# junior = ["junior", "júnior", "jr", "intern", "estagiário"]
# pleno  = ["pleno", "pl", "mid", "mid-level", "intermediate"]
# senior = ["senior", "sênior", "sr"]
# master = ["master", "lead", "specialist", "principal", "staff"]

# ---------------------------------------------------------------------------
# Perfis de busca: reutilizáveis entre fontes.
# levels: "junior" | "pleno" | "senior" | "master"
# ---------------------------------------------------------------------------
[profiles.senior_remoto_br]
levels = ["senior"]
countries = ["BR"]          # vazio = qualquer país
remote_only = true
accept_unspecified_level = true

[profiles.pleno_ou_senior]
levels = ["pleno", "senior"]
remote_only = true

# ---------------------------------------------------------------------------
# Fontes de vagas. `type` escolhe o adapter; os demais campos são dele.
# ---------------------------------------------------------------------------
[[sources]]
type = "lever"
company = "ciandt"      # slug de jobs.lever.co/<company>
profile = "senior_remoto_br"

# ---------------------------------------------------------------------------
# Match com IA (opcional; usado com --match).
# ---------------------------------------------------------------------------
[match]
backend = "opencode"
model = "opencode/deepseek-v4.1-flash-free"   # `opencode models` lista os disponíveis
timeout = 180
# Currículo SEM dados pessoais (nome, contato, links): ele é enviado para a IA.
resume = "curriculo.md"
# prompt = "meu_prompt.md"   # opcional; padrão: prompt embutido no pacote

# ---------------------------------------------------------------------------
# Saída (sempre acionada).
# ---------------------------------------------------------------------------
[output]
console = true
json_file = "vagas_filtradas.json"

# ---------------------------------------------------------------------------
# Notificadores extras, acionados com --notify (ex.: Telegram, em breve).
# ---------------------------------------------------------------------------
# [[notifiers]]
# type = "telegram"
